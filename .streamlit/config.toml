# Streamlit theme for the Substation Defence Console (src/dashboard.py)
[theme]
base = "dark"
primaryColor = "#f5a623"
backgroundColor = "#0b1017"
secondaryBackgroundColor = "#141d29"
textColor = "#e8eef6"
font = "monospace"

[server]
# Watcher disabled: Streamlit's LocalSourcesWatcher walks every imported
# module's __path__, and transformers' lazy-loaded zoedepth submodule raises
# ModuleNotFoundError for torchvision (not a project dependency, not used
# anywhere here) when touched. Cosmetic-only - it never crashed the app -
# but it floods the terminal, so the watcher (and runOnSave with it) is off.
fileWatcherType = "none"
